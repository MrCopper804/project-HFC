<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFC Admin - Master Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --admin: #ff0055;
            --admin-glow: rgba(255, 0, 85, 0.3);
            --bg: #05070a;
            --bg-secondary: #0a0f1a;
            --neon: #64ffda;
            --neon-glow: rgba(100, 255, 218, 0.3);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.3);
            --danger: #ff4d4d;
            --success: #00b894;
            --text: #e6f1ff;
            --text-muted: #556080;
            --border: rgba(255, 255, 255, 0.05);
            --border-light: rgba(100, 255, 218, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(circle at top right, rgba(255, 0, 85, 0.08) 0%, transparent 40%),
                radial-gradient(circle at bottom left, rgba(100, 255, 218, 0.05) 0%, transparent 40%);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        /* Header */
        .admin-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .admin-header::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 0, 85, 0.15) 0%, transparent 70%);
            z-index: -1;
            filter: blur(60px);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--admin);
            letter-spacing: 4px;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 900;
            text-shadow: 0 0 30px var(--admin-glow);
            text-transform: uppercase;
        }

        .admin-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 20px;
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid var(--admin);
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            color: var(--admin);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Layout */
        .admin-grid {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 1024px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Boxes */
        .box {
            background: rgba(26, 26, 46, 0.6);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .box-admin {
            border-color: var(--admin);
        }

        .box-deposit {
            border-color: var(--neon);
        }

        .box-withdraw {
            border-color: var(--gold);
        }

        .section-title {
            color: var(--neon);
            font-size: 13px;
            letter-spacing: 3px;
            text-align: left;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .section-title::before {
            content: '▸';
            color: var(--admin);
            font-size: 18px;
        }

        .box-withdraw .section-title {
            color: var(--gold);
        }

        /* Forms */
        input, select {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-family: 'Rajdhani', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--admin);
            background: rgba(255, 0, 85, 0.05);
            box-shadow: 0 0 0 3px rgba(255, 0, 85, 0.1);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Buttons */
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--admin), #ff4d79);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 5px 20px var(--admin-glow);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--admin-glow);
        }

        button:active {
            transform: translateY(0);
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.05);
            font-size: 11px;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .reset-btn:hover {
            background: var(--danger);
            border-color: var(--danger);
        }

        /* Links */
        .manage-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--admin);
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.3s ease;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 0, 85, 0.2);
            background: rgba(255, 0, 85, 0.05);
        }

        .manage-link:hover {
            color: var(--neon);
            border-color: var(--neon);
            background: rgba(100, 255, 218, 0.05);
        }

        #status {
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Tables */
        .table-container {
            margin: 0;
            background: rgba(26, 26, 46, 0.6);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .table-container .section-title {
            padding: 25px 30px;
            margin-bottom: 0;
            border-bottom: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th {
            background: rgba(0, 0, 0, 0.4);
            color: var(--neon);
            padding: 18px 20px;
            border-bottom: 2px solid var(--border);
            text-transform: uppercase;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 1.5px;
            font-family: 'Orbitron', sans-serif;
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(100, 255, 218, 0.03);
            color: var(--text);
        }

        /* Request Cards */
        .req-container {
            padding: 20px;
        }

        .req-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .req-card:hover {
            border-color: var(--neon);
            background: rgba(100, 255, 218, 0.03);
            transform: translateX(5px);
        }

        .withdraw-card {
            border-color: rgba(255, 215, 0, 0.2);
        }

        .withdraw-card:hover {
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.03);
        }

        .req-info {
            font-size: 12px;
            line-height: 1.8;
            flex: 1;
        }

        .req-info b {
            color: var(--neon);
            font-size: 14px;
        }

        .withdraw-card .req-info b {
            color: var(--gold);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            margin-left: 20px;
        }

        .btn-approve, .btn-cancel {
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 10px;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            width: auto;
            margin: 0;
        }

        .btn-approve {
            background: var(--neon);
            color: #000;
        }

        .btn-approve:hover {
            background: #4dd9b5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--neon-glow);
        }

        .btn-cancel {
            background: var(--danger);
            color: #fff;
        }

        .btn-cancel:hover {
            background: #ff6b6b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.4);
        }

        .btn-paid {
            background: var(--gold);
            color: #000;
        }

        .btn-paid:hover {
            background: #ffe033;
            box-shadow: 0 5px 15px var(--gold-glow);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .input-row {
                grid-template-columns: 1fr;
            }

            .req-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .btn-group {
                width: 100%;
                margin-left: 0;
            }

            .btn-approve, .btn-cancel {
                flex: 1;
            }

            table {
                font-size: 11px;
            }

            th, td {
                padding: 12px 10px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--admin);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ff4d79;
        }
    </style>
</head>
<body>

    <div class="admin-header">
        <h2>⚡ Command Center</h2>
        <span class="admin-badge">Admin Access Only</span>
    </div>

    <div class="admin-grid">
        <!-- Left Column - Controls -->
        <div>
            <div class="box box-admin">
                <span class="section-title">Agent Management</span>
                <input type="email" id="targetEmail" placeholder="Agent Email Address">
                <div class="input-row">
                    <input type="number" id="giveXP" placeholder="+/- XP">
                    <input type="number" id="giveCoins" placeholder="+/- Coins">
                </div>
                <select id="setRank">
                    <option value="">-- Change Rank --</option>
                    <option value="recruit">Recruit</option>
                    <option value="agent">Agent</option>
                    <option value="operative">Operative</option>
                    <option value="specialist">Specialist</option>
                    <option value="commander">Commander</option>
                    <option value="legend">Legend</option>
                </select>
                <button id="execBtn">Execute Update</button>
                <button class="reset-btn" id="resetCooldownBtn">🔄 Reset Weekly Mission Lock</button>

                <a href="userdata.html" class="manage-link">👥 Manage All Users (Full DB)</a>

                <p id="status">System Ready</p>
            </div>
        </div>

        <!-- Right Column - Requests & Table -->
        <div>
            <!-- Deposits -->
            <div class="table-container box-deposit" style="margin-bottom: 30px;">
                <span class="section-title" style="color: var(--neon);">📥 Pending Deposits</span>
                <div class="req-container" id="depositContainer">
                    <div class="empty-state">No pending deposits...</div>
                </div>
            </div>

            <!-- Withdrawals -->
            <div class="table-container box-withdraw" style="margin-bottom: 30px;">
                <span class="section-title" style="color: var(--gold);">📤 Pending Withdrawals</span>
                <div class="req-container" id="withdrawContainer">
                    <div class="empty-state">No pending withdrawals...</div>
                </div>
            </div>

            <!-- User Table -->
            <div class="table-container">
                <span class="section-title">👥 All Agents</span>
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>XP</th>
                            <th>Coins</th>
                            <th>Rank</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="5" class="empty-state">Loading agents...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, updateDoc, doc, increment, orderBy, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIT9JgQ8t044EbgeGSGWNfh-CgNrWajN8",
            authDomain: "hfc-academy.firebaseapp.com",
            projectId: "hfc-academy",
            storageBucket: "hfc-academy.firebasestorage.app",
            messagingSenderId: "84006497196",
            appId: "1:84006497196:web:be0d33ae2db19dd77ae809"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- LISTEN TO DEPOSITS ---
        onSnapshot(query(collection(db, "deposit_requests"), where("status", "==", "pending")), (snap) => {
            const container = document.getElementById('depositContainer');
            container.innerHTML = snap.empty ? '<div class="empty-state">No pending deposits.</div>' : '';
            snap.forEach((req) => {
                const d = req.data();
                const card = document.createElement('div');
                card.className = 'req-card';
                card.innerHTML = `
                    <div class="req-info">
                        <b>${d.email}</b><br>
                        PKR: ${d.pkrAmount} → <b>${d.coinsRequested} Coins</b><br>
                        TID: <span style="color:#888">${d.transactionID}</span>
                    </div>
                    <div class="btn-group">
                        <button class="btn-approve" onclick="approveDeposit('${req.id}', '${d.uid}', ${d.coinsRequested})">Approve</button>
                        <button class="btn-cancel" onclick="cancelRequest('deposit_requests', '${req.id}')">Cancel</button>
                    </div>
                `;
                container.appendChild(card);
            });
        });

        // --- LISTEN TO WITHDRAWALS ---
        onSnapshot(query(collection(db, "withdraw_requests"), where("status", "==", "pending")), (snap) => {
            const container = document.getElementById('withdrawContainer');
            container.innerHTML = snap.empty ? '<div class="empty-state">No pending withdrawals.</div>' : '';
            snap.forEach((req) => {
                const d = req.data();
                const card = document.createElement('div');
                card.className = 'req-card withdraw-card';
                card.innerHTML = `
                    <div class="req-info">
                        <b>${d.method}: ${d.accountNumber}</b><br>
                        Name: ${d.accountName} | User: ${d.email}<br>
                        Coins: ${d.coinsAmount} → <b style="color:#fff">PKR: ${d.pkrAmount}</b>
                    </div>
                    <div class="btn-group">
                        <button class="btn-approve btn-paid" onclick="approveWithdraw('${req.id}')">Paid</button>
                        <button class="btn-cancel" onclick="rejectWithdraw('${req.id}', '${d.uid}', ${d.coinsAmount})">Reject</button>
                    </div>
                `;
                container.appendChild(card);
            });
        });

        // --- FUNCTIONS ---
        window.approveDeposit = async (id, uid, coins) => {
            if(!confirm("Approve and add coins?")) return;
            await updateDoc(doc(db, "users", uid), { coins: increment(coins) });
            await deleteDoc(doc(db, "deposit_requests", id));
            alert("✅ Deposit Approved!");
        };

        window.approveWithdraw = async (id) => {
            if(!confirm("Mark as PAID? (Make sure you sent the money first)")) return;
            await deleteDoc(doc(db, "withdraw_requests", id));
            alert("✅ Withdrawal Closed.");
        };

        window.rejectWithdraw = async (id, uid, coins) => {
            if(!confirm("Reject and REFUND coins to user?")) return;
            await updateDoc(doc(db, "users", uid), { coins: increment(coins) });
            await deleteDoc(doc(db, "withdraw_requests", id));
            alert("✅ Rejected and Refunded.");
        };

        window.cancelRequest = async (col, id) => {
            if(!confirm("Delete this request?")) return;
            await deleteDoc(doc(db, col, id));
        };

        document.getElementById('resetCooldownBtn').onclick = async () => {
            const email = document.getElementById('targetEmail').value.trim().toLowerCase();
            const q = query(collection(db, "users"), where("email", "==", email));
            const snap = await getDocs(q);
            if(!snap.empty) {
                await updateDoc(doc(db, "users", snap.docs[0].id), { lastWeeklyCrypt: 0 });
                alert("✅ Mission Unlocked!");
            }
        };

        onSnapshot(query(collection(db, "users"), orderBy("score", "desc")), (snap) => {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = "";
            snap.forEach(u => {
                const d = u.data();
                const row = document.createElement('tr');
                row.innerHTML = `<td style="color:#fff">${d.username || 'N/A'}</td><td>${d.email}</td><td style="color:var(--neon)">${d.score || 0}</td><td style="color:var(--gold)">${d.coins || 0}</td><td style="text-transform:uppercase; font-weight:bold; color:var(--admin)">${d.rank || 'recruit'}</td>`;
                tbody.appendChild(row);
            });
            if(snap.empty) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No users found.</td></tr>';
            }
        });

        document.getElementById('execBtn').onclick = async () => {
            const email = document.getElementById('targetEmail').value.trim().toLowerCase();
            const xp = parseInt(document.getElementById('giveXP').value) || 0;
            const coins = parseInt(document.getElementById('giveCoins').value) || 0;
            const rank = document.getElementById('setRank').value;
            const q = query(collection(db, "users"), where("email", "==", email));
            const snap = await getDocs(q);
            if(!snap.empty) {
                const upData = { score: increment(xp), coins: increment(coins) };
                if(rank) upData.rank = rank;
                await updateDoc(doc(db, "users", snap.docs[0].id), upData);
                alert("✅ Updated!");
                document.getElementById('status').innerText = "Update Executed Successfully";
                document.getElementById('status').style.color = "var(--neon)";
            } else {
                alert("User not found!");
            }
        };
    </script>
</body>
</html>
