<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HFC Academy - XP STORM</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --bg-secondary: #0a0f1a;
            --bg-tertiary: #112240;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-dark: rgba(10, 15, 26, 0.95);
            --neon: #64ffda;
            --neon-glow: rgba(100, 255, 218, 0.3);
            --danger: #ff4d4d;
            --danger-glow: rgba(255, 77, 77, 0.3);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.3);
            --text: #e6f1ff;
            --text-muted: #556080;
            --border: rgba(100, 255, 218, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, #112240 0%, #05070a 75%);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- ENHANCED HEADER --- */
        .header {
            width: 100%;
            background: var(--glass-dark);
            padding: 15px 20px;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            box-sizing: border-box;
            z-index: 100;
            height: 70px;
            flex-shrink: 0;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.5);
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: var(--glass);
            color: var(--neon);
            text-decoration: none;
            font-size: 20px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: rgba(100, 255, 218, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--neon-glow);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .user-stats {
            flex-grow: 1;
            margin: 0 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .xp-display {
            color: var(--neon);
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 1.5px;
            background: rgba(100, 255, 218, 0.1);
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid rgba(100, 255, 218, 0.2);
        }

        .game-icon {
            color: var(--gold);
            font-size: 24px;
            filter: drop-shadow(0 0 10px var(--gold-glow));
        }

        /* --- CONTAINER --- */
        .container {
            flex-grow: 1;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            overflow-y: auto;
        }

        /* --- GAME CARD --- */
        .game-card {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 35px;
            backdrop-filter: blur(15px);
            box-sizing: border-box;
            text-align: center;
            border-top: 4px solid var(--neon);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px var(--neon-glow);
        }

        .game-title {
            color: var(--neon);
            margin: 0 0 10px 0;
            font-size: 28px;
            letter-spacing: 3px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            text-shadow: 0 0 20px var(--neon-glow);
        }

        .game-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .fee-info {
            display: inline-block;
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid rgba(100, 255, 218, 0.2);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--neon);
            margin-right: 10px;
        }

        .reward-info {
            display: inline-block;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
        }

        /* --- START SCREEN --- */
        #startScreen {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-list {
            font-size: 13px;
            margin-bottom: 30px;
            line-height: 2;
            color: var(--text-secondary);
            text-align: left;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-list div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-list span {
            color: var(--neon);
            font-weight: 700;
        }

        /* --- TIMER --- */
        .timer-circle {
            font-size: 36px;
            color: var(--danger);
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 0 0 20px var(--danger-glow);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 3px;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* --- CIPHER BOX --- */
        .cipher-box {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--neon);
            padding: 25px;
            border-radius: 16px;
            font-size: 18px;
            color: var(--neon);
            min-height: 120px;
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 20px;
            word-break: break-all;
            box-shadow: inset 0 0 20px rgba(100, 255, 218, 0.1), 0 0 20px var(--neon-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.8;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
        }

        .cipher-box::-webkit-scrollbar {
            width: 6px;
        }

        .cipher-box::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .cipher-box::-webkit-scrollbar-thumb {
            background: var(--neon);
            border-radius: 3px;
        }

        /* --- TEXTAREA --- */
        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 18px;
            color: white;
            font-size: 16px;
            resize: none;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
            font-family: 'Rajdhani', sans-serif;
            transition: all 0.3s ease;
            min-height: 100px;
        }

        textarea:focus {
            border-color: var(--neon);
            background: rgba(100, 255, 218, 0.05);
            box-shadow: 0 0 0 3px rgba(100, 255, 218, 0.1);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        /* --- BUTTONS --- */
        .btn-main {
            background: linear-gradient(135deg, var(--neon), #4dd9b5);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 14px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px var(--neon-glow);
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px var(--neon-glow);
        }

        .btn-main:active {
            transform: translateY(-1px);
        }

        /* --- STATUS MESSAGE --- */
        .status-msg {
            font-size: 13px;
            margin-top: 20px;
            font-weight: 800;
            min-height: 20px;
            padding: 12px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-success {
            color: var(--neon);
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid rgba(100, 255, 218, 0.2);
        }

        .status-error {
            color: var(--danger);
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        /* --- MISSION SCREEN --- */
        #missionScreen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .game-card {
                padding: 25px 20px;
            }

            .game-title {
                font-size: 24px;
            }

            .timer-circle {
                font-size: 28px;
            }

            .cipher-box {
                font-size: 16px;
                padding: 18px;
            }

            textarea {
                font-size: 14px;
                padding: 14px;
            }

            .btn-main {
                padding: 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="lobby.html" class="icon-btn" title="Back to Lobby">🏠</a>
        <div class="user-stats">
            <div class="xp-display" id="syncStatus">XP: --</div>
        </div>
        <div class="game-icon">⚡</div>
    </div>

    <div class="container">
        <div class="game-card">
            <h2 class="game-title">⛈️ XP STORM</h2>
            <p class="game-subtitle">Decode the cipher before time runs out!</p>
            
            <div style="margin-bottom: 25px;">
                <span class="fee-info">FEE: 50 XP</span>
                <span class="reward-info">REWARD: 150 XP</span>
            </div>

            <div id="startScreen">
                <div class="info-list">
                    <div>📝 <span>50 Letters</span> Random Decode</div>
                    <div>⏱️ <span>300 Seconds</span> Time Limit</div>
                    <div>💰 <span>50 XP</span> Deducted Immediately</div>
                </div>
                <button class="btn-main" id="startBtn">START CHALLENGE</button>
            </div>

            <div id="missionScreen">
                <div class="timer-circle" id="timer">300s</div>
                <div class="cipher-box" id="cipherBox"></div>
                <textarea id="userInput" rows="4" placeholder="Type decoded letters here..."></textarea>
                <button class="btn-main" id="submitBtn">CONFIRM TRANSMISSION</button>
            </div>

            <div id="statusMsg" class="status-msg"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBIT9JgQ8t044EbgeGSGWNfh-CgNrWajN8",
        authDomain: "hfc-academy.firebaseapp.com",
        projectId: "hfc-academy",
        storageBucket: "hfc-academy.firebasestorage.app",
        messagingSenderId: "84006497196",
        appId: "1:84006497196:web:be0d33ae2db19dd77ae809"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const hfcData = {'a':'+','b':'[]','c':'©','d':'÷','e':'=','f':'_','g':'>','h':'|','i':'!','j':'#','k':':','l':'<','m':'*','n':'°','o':'()','p':'¶','q':'?','r':'®','s':'$','t':'™','u':"'",'v':'^','w':'&','x':'`','y':'~','z':'℅'};
    const alphabets = "abcdefghijklmnopqrstuvwxyz";

    let currentUser = null;
    let userXP = 0;
    let targetEnglish = "";
    let timerInterval = null;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                if(snap.exists()){
                    const data = snap.data();
                    userXP = data.score || 0;
                    document.getElementById('syncStatus').innerText = "XP: " + userXP;
                }
            });
        } else { window.location.href = "auth.html"; }
    });

    window.startMission = async () => {
        if (userXP < 50) {
            const msg = document.getElementById('statusMsg');
            msg.className = 'status-msg status-error';
            msg.innerText = "⚠️ INSUFFICIENT XP! Need 50 XP to start.";
            return;
        }

        const userRef = doc(db, "users", currentUser.uid);
        await updateDoc(userRef, { score: increment(-50) });

        targetEnglish = "";
        let cipherText = "";

        for(let i=0; i<50; i++) {
            let char = alphabets[Math.floor(Math.random() * alphabets.length)];
            targetEnglish += char;
            cipherText += hfcData[char] || char;
        }

        document.getElementById('cipherBox').innerText = cipherText;
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('missionScreen').style.display = 'block';
        startTimer(300);
    };

    function startTimer(seconds) {
        let timeLeft = seconds;
        document.getElementById('timer').innerText = timeLeft + "s";
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft + "s";
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishMission(true);
            }
        }, 1000);
    }

    window.finishMission = async (timeout = false) => {
        clearInterval(timerInterval);
        const input = document.getElementById('userInput').value.trim().toLowerCase().replace(/\s/g, '');
        const msg = document.getElementById('statusMsg');
        const userRef = doc(db, "users", currentUser.uid);

        if (!timeout && input === targetEnglish) {
            await updateDoc(userRef, { score: increment(150) });
            msg.className = 'status-msg status-success';
            msg.innerText = "✅ SUCCESS! +150 XP SECURED.";
        } else {
            msg.className = 'status-msg status-error';
            msg.innerText = timeout ? "⏰ TIME EXPIRED! MISSION FAILED." : "❌ INCORRECT DECODE! XP LOST.";
        }

        setTimeout(() => {
            document.getElementById('missionScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'block';
            document.getElementById('userInput').value = "";
            msg.innerText = "";
            document.getElementById('timer').innerText = "300s";
        }, 3000);
    };

    document.getElementById('startBtn').onclick = startMission;
    document.getElementById('submitBtn').onclick = () => finishMission(false);

</script>
</body>
</html>
