<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HFC - Agent Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --bg-secondary: #0a0f1a;
            --neon: #64ffda;
            --neon-glow: rgba(100, 255, 218, 0.3);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.3);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-dark: rgba(10, 15, 26, 0.8);
            --text: #e6f1ff;
            --text-muted: #556080;
            --border: rgba(100, 255, 218, 0.15);
            --danger: #ff4d4d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at center, #112240 0%, #05070a 90%);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Back Button */
        .back-nav {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--glass);
        }

        .back-btn:hover {
            color: var(--neon);
            border-color: var(--neon);
            background: rgba(100, 255, 218, 0.05);
        }

        /* Profile Card */
        .profile-card {
            background: var(--glass-dark);
            padding: 45px 40px;
            border-radius: 30px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(20px);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px var(--neon-glow);
            margin-top: 30px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Avatar */
        .avatar-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            position: relative;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 0 30px var(--neon-glow);
            border: 4px solid rgba(255, 255, 255, 0.1);
        }

        .avatar-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 255, 218, 0.3) 0%, transparent 70%);
            z-index: -1;
            filter: blur(20px);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Title */
        .profile-title {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 3px;
            margin-bottom: 5px;
            color: var(--neon);
            font-size: 22px;
            font-weight: 900;
            text-shadow: 0 0 15px var(--neon-glow);
        }

        .profile-email {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 30px;
            word-break: break-all;
        }

        /* Stat Grid */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            border-color: var(--neon);
            background: rgba(100, 255, 218, 0.05);
            transform: translateY(-3px);
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
        }

        .val-xp {
            color: var(--neon);
            text-shadow: 0 0 10px var(--neon-glow);
        }

        .val-coin {
            color: var(--gold);
            text-shadow: 0 0 10px var(--gold-glow);
        }

        /* Form Groups */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            text-align: center;
            font-size: 15px;
            font-family: 'Rajdhani', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--neon);
            background: rgba(100, 255, 218, 0.05);
            box-shadow: 0 0 0 3px rgba(100, 255, 218, 0.1);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        /* Update Button */
        .update-btn {
            background: linear-gradient(135deg, var(--neon), #4dd9b5);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-size: 14px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px var(--neon-glow);
        }

        .update-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px var(--neon-glow);
        }

        .update-btn:active {
            transform: translateY(-1px);
        }

        /* Status Message */
        .msg {
            font-size: 12px;
            margin-top: 20px;
            min-height: 18px;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
        }

        .msg-success {
            color: var(--neon);
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid rgba(100, 255, 218, 0.2);
        }

        .msg-error {
            color: var(--danger);
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        /* Back Link */
        .back-link {
            display: block;
            margin-top: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid transparent;
        }

        .back-link:hover {
            color: var(--neon);
            background: rgba(100, 255, 218, 0.05);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .profile-card {
                padding: 35px 25px;
            }

            .avatar-container {
                width: 80px;
                height: 80px;
            }

            .avatar {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="lobby.html" class="back-btn">← Back to Lobby</a>
    </div>

    <div class="profile-card">
        <div class="avatar-container">
            <div class="avatar-glow"></div>
            <div class="avatar">👤</div>
        </div>

        <h2 class="profile-title">AGENT PROFILE</h2>
        <p id="userEmail" class="profile-email">Authenticating...</p>

        <div class="stat-grid">
            <div class="stat-box">
                <span class="stat-label">Mission XP</span>
                <span class="stat-value val-xp" id="displayXP">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">HFC Coins</span>
                <span class="stat-value val-coin" id="displayCoins">0</span>
            </div>
        </div>

        <div class="input-group">
            <span class="input-label">Agent Username</span>
            <input type="text" id="usernameInput" placeholder="Set Codename">
        </div>

        <div class="input-group">
            <span class="input-label">Date of Birth</span>
            <input type="date" id="dobInput">
        </div>

        <button class="update-btn" id="updateBtn">Update Cloud Data</button>
        <p class="msg" id="statusMsg"></p>

        <a href="lobby.html" class="back-link">← Return to Lobby</a>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBIT9JgQ8t044EbgeGSGWNfh-CgNrWajN8",
        authDomain: "hfc-academy.firebaseapp.com",
        projectId: "hfc-academy",
        storageBucket: "hfc-academy.firebasestorage.app",
        messagingSenderId: "84006497196",
        appId: "1:84006497196:web:be0d33ae2db19dd77ae809"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUID = null;
    let lastUpdateTS = null;

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUID = user.uid;
            document.getElementById('userEmail').innerText = user.email;
            await loadProfileData();
        } else {
            window.location.href = "auth.html";
        }
    });

    async function loadProfileData() {
        const status = document.getElementById('statusMsg');
        status.innerText = "Syncing with cloud...";

        const docRef = doc(db, "users", currentUID);
        const snap = await getDoc(docRef);

        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('displayXP').innerText = data.score || 0;
            document.getElementById('displayCoins').innerText = data.coins || 0;
            document.getElementById('usernameInput').value = data.username || "";
            document.getElementById('dobInput').value = data.dob || "";
            lastUpdateTS = data.lastUsernameChange;
            status.innerText = "✓ Cloud Synced";
            status.className = "msg msg-success";
            setTimeout(() => { status.innerText = ""; }, 2000);
        }
    }

    document.getElementById('updateBtn').onclick = async () => {
        const newUsername = document.getElementById('usernameInput').value;
        const newDob = document.getElementById('dobInput').value;
        const status = document.getElementById('statusMsg');

        if(!newUsername) { 
            status.innerText = "⚠️ Username cannot be empty!"; 
            status.className = "msg msg-error";
            return; 
        }

        status.innerText = "Validating...";

        // 30 Days Check
        if (lastUpdateTS) {
            const lastDate = lastUpdateTS.toDate();
            const now = new Date();
            const diffTime = Math.abs(now - lastDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 30) {
                status.innerText = `🔒 LOCKED: Change again in ${30 - diffDays} days.`;
                status.className = "msg msg-error";
                return;
            }
        }

        try {
            const userRef = doc(db, "users", currentUID);
            await updateDoc(userRef, {
                username: newUsername,
                dob: newDob,
                lastUsernameChange: serverTimestamp()
            });
            status.innerText = "✅ PROFILE UPDATED IN CLOUD!";
            status.className = "msg msg-success";
            loadProfileData();
        } catch (e) {
            status.innerText = "❌ Error updating profile.";
            status.className = "msg msg-error";
        }
    };
</script>
</body>
</html>
